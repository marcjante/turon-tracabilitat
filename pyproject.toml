[project]
name = "turon-tracabilitat"
version = "0.1.0"
description = "API de trazabilidad para Fleca i Pastisseria Turon"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
